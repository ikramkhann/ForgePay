# AI Attribution Block: AI-assisted LocalStack Compose definition for local AWS emulation.
version: '3.8'

services:
  localstack:
    image: localstack/localstack:3.0
    container_name: forgepay-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,dynamodb,kms,sts,ecr
      - AWS_DEFAULT_REGION=ap-south-1
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - ./init-aws-localstack.sh:/etc/localstack/init/ready.d/init-aws.sh
      - "/var/run/docker.sock:/var/run/docker.sock"
