# AI Attribution Block: AI-assisted Chaos Mesh pod kill experiment specification.
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: pod-kill-payment-service
  namespace: forgepay
spec:
  action: pod-kill
  mode: fixed
  value: '1'
  selector:
    namespaces:
      - forgepay
    labelSelectors:
      app.kubernetes.io/name: forgepay
      app.kubernetes.io/component: core
  duration: '30s'
  scheduler:
    cron: '@every 10m'
