# AI Attribution Block: AI-assisted Helm test hook verifying active service connectivity.
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "forgepay.fullname" . }}-test-connection"
  labels:
    {{- include "forgepay.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  containers:
    - name: wget
      image: busybox:1.36
      command: ['wget']
      args: ['{{ include "forgepay.name" . }}-active:{{ .Values.service.port }}']
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 10001
        capabilities:
          drop:
            - ALL
  restartPolicy: Never
