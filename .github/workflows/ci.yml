# AI Attribution Block
# AI-assisted CI/CD foundation. A human owner must configure protected branches,
# environments, secrets, registry permissions, and controlled DAST targets before use.
name: CI - build once and attest

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dast_target_url:
        description: Controlled, non-production URL authorized for OWASP ZAP
        required: false
        type: string

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write
  attestations: write

env:
  IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
  RELEASE_METADATA: release-metadata.json

jobs:
  source-control:
    name: "1. Source control"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Require a non-merge source revision
        run: git rev-parse --verify "${GITHUB_SHA}^{commit}"

  build:
    name: "2. Build"
    needs: source-control
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.build-image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and unit test
        run: ./mvnw --batch-mode verify
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        name: Calculate image reference
        shell: bash
        run: echo "image=${IMAGE_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - id: build-image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.image.outputs.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Record immutable build output
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          DIGEST: ${{ steps.build-image.outputs.digest }}
        run: |
          test -n "$DIGEST"
          jq -n --arg image "$IMAGE" --arg digest "$DIGEST" --arg source "$GITHUB_SHA" \
            '{image: $image, digest: $digest, sourceRevision: $source}' > "$RELEASE_METADATA"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: release-metadata
          path: ${{ env.RELEASE_METADATA }}
          if-no-files-found: error

  sast:
    name: "3. SAST (SonarQube/SonarCloud)"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Require Sonar configuration
        env: { SONAR_TOKEN: '${{ secrets.SONAR_TOKEN }}' }
        run: test -n "$SONAR_TOKEN"
      - uses: sonarsource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

  dependency-container-scanning:
    name: "4. Dependency and container scanning"
    needs: [build, sast]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with: { name: release-metadata }
      - name: Install Syft, Trivy, and Cosign
        uses: aquasecurity/setup-trivy@v0.2.3
      - uses: anchore/sbom-action/download-syft@v0.18.0
      - uses: sigstore/cosign-installer@v3.9.0
      - name: Scan source dependencies
        run: trivy fs --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed .
      - name: Generate SBOM, scan immutable image, and sign it
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE_REF="$(jq -r '.image + "@" + .digest' "$RELEASE_METADATA")"
          syft "$IMAGE_REF" -o spdx-json=sbom.spdx.json
          trivy image --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed "$IMAGE_REF"
          cosign sign --yes "$IMAGE_REF"
          cosign verify "$IMAGE_REF" \
            --certificate-identity-regexp "${{ github.server_url }}/${{ github.repository }}/.github/workflows/ci.yml@.*" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Attest build provenance to the immutable image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ needs.build.outputs.image }}
          subject-digest: ${{ needs.build.outputs.digest }}
          push-to-registry: true
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: release-sbom
          path: sbom.spdx.json
          if-no-files-found: error

  integration-contract-testing:
    name: "5. Integration and contract testing"
    needs: dependency-container-scanning
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: test, POSTGRES_USER: test, POSTGRES_DB: forgepay_test }
        ports: ['5432:5432']
      redis:
        image: redis:7
        ports: ['6379:6379']
      rabbitmq:
        image: rabbitmq:3.13-management
        ports: ['5672:5672']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Execute integration and Pact contract tests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/forgepay_test
          SPRING_DATASOURCE_USERNAME: test
          SPRING_DATASOURCE_PASSWORD: test
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_RABBITMQ_HOST: localhost
        run: ./mvnw --batch-mode verify -Pintegration,contract

  dast:
    name: "6. DAST (OWASP ZAP)"
    needs: integration-contract-testing
    runs-on: ubuntu-latest
    steps:
      - name: Resolve authorized controlled target
        id: target
        env: { INPUT_TARGET: '${{ inputs.dast_target_url }}', CONFIGURED_TARGET: '${{ vars.DAST_TARGET_URL }}' }
        run: |
          TARGET="${INPUT_TARGET:-$CONFIGURED_TARGET}"
          test -n "$TARGET"
          case "$TARGET" in https://*) ;; *) exit 1;; esac
          echo "url=$TARGET" >> "$GITHUB_OUTPUT"
      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ steps.target.outputs.url }}
          cmd_options: '-a -m 5 -I'

  policy-compliance-gates:
    name: "7. Policy and compliance gates"
    needs: dast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkov IaC scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: deploy
          framework: kubernetes,helm,kustomize
          soft_fail: false
      - name: Install Conftest
        uses: instrumenta/conftest-action@master
        with: { version: 0.57.0 }
      - name: Validate GitOps manifests against OPA policies
        run: conftest test --policy deploy/policy/opa deploy/gitops/environments
      - name: Validate rendered Helm package and environment overlays
        run: bash deploy/scripts/validate-manifests.sh
